    theme: {
      extend: {
        colors: {
          bg: V('bg'), surface: V('surface'), surface2: V('surface-2'), line: V('line'),
          ink: V('ink'), muted: V('muted'), brand: V('brand'), brandsoft: V('brand-soft'),
          onbrand: V('on-brand'), stamp: V('stamp'), stampsoft: V('stamp-soft'),
          ok: V('ok'), oksoft: V('ok-soft'), warn: V('warn'), warnsoft: V('warn-soft'),

  /* Layout: sticky prototype bar → role nav rail → canvas (phone frame for workers, desktop workspace for organisations).
     Palette: passport-cover blue + customs-stamp amber on blue-tinted neutrals. */

    --bg: 243 245 250; --surface: 255 255 255; --surface-2: 234 238 246; --line: 214 220 233;

    :root:not([data-theme="light"]) {

  body { background: rgb(var(--bg)); color: rgb(var(--ink)); font-size: 15px; line-height: 1.5;

  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: rgb(var(--surface)); }
  .gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .topbar { top: env(safe-area-inset-top, 0px); }
  h1, h2, h3 { text-wrap: balance; }
  .tnum { font-variant-numeric: tabular-nums; }
  .eyebrow { letter-spacing: .08em; text-transform: uppercase; font-size: 11px; font-weight: 700; }
  :focus-visible { outline: 2px solid rgb(var(--brand)); outline-offset: 2px; border-radius: 6px; }
  .scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }

  /* Phone frame */
  .phone { width: 100%; max-width: 420px; border: 1px solid rgb(var(--line)); border-radius: 24px; background: rgb(var(--surface)); overflow: hidden; display: flex; flex-direction: column; }
  .phone-body { flex: 1; }
  @media (min-width: 768px) {
    .phone { width: 390px; height: 780px; border: 10px solid rgb(var(--bezel)); border-radius: 46px; box-shadow: 0 30px 60px -30px rgb(var(--ink) / .45); }
    .phone-body { overflow-y: auto; }
  }
  .status-bar { font-size: 12px; font-weight: 600; }

  /* Skill Passport cover */
  .passport-cover { background:
      radial-gradient(circle at 85% 15%, rgb(var(--on-brand) / .10) 0 18%, transparent 19%),
      repeating-radial-gradient(circle at 85% 15%, rgb(var(--on-brand) / .07) 0 1px, transparent 1px 9px),
      rgb(var(--brand)); color: rgb(var(--on-brand)); }
  .mrz { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 10.5px; letter-spacing: .12em; word-break: break-all; line-height: 1.6; }
  .stamp { border: 2px solid rgb(var(--stamp)); color: rgb(var(--stamp)); transform: rotate(-6deg); border-radius: 8px; font-family: "JetBrains Mono", monospace; font-weight: 700; letter-spacing: .1em; font-size: 10px; padding: 3px 8px; display: inline-block; }

  /* Voice waveform */
  .wave { display: flex; align-items: center; justify-content: center; gap: 5px; height: 56px; }
  .wave span { width: 5px; border-radius: 4px; background: rgb(var(--brand)); animation: wave 0.9s ease-in-out infinite; }
  .wave span:nth-child(2n) { animation-delay: .15s } .wave span:nth-child(3n) { animation-delay: .3s } .wave span:nth-child(4n) { animation-delay: .45s }
  @keyframes wave { 0%, 100% { height: 10px } 50% { height: 48px } }
  .mic-pulse { box-shadow: 0 0 0 0 rgb(var(--brand) / .45); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgb(var(--brand) / .45) } 70% { box-shadow: 0 0 0 22px rgb(var(--brand) / 0) } 100% { box-shadow: 0 0 0 0 rgb(var(--brand) / 0) } }
  @media (prefers-reduced-motion: reduce) { .wave span, .mic-pulse { animation: none } .wave span { height: 28px } }

  .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 80; max-width: calc(100% - 32px); }
  input, select, textarea { background: rgb(var(--surface)); color: rgb(var(--ink)); }
  .field { width: 100%; border: 1px solid rgb(var(--line)); border-radius: 10px; padding: 9px 12px; font-size: 14px; }
  .field:focus { outline: 2px solid rgb(var(--brand) / .6); outline-offset: 0; border-color: rgb(var(--brand)); }
</style>

    if (t.dataset.cost !== undefined) { const c = S.draft.costs[+t.dataset.cost]; if (c) { c[t.dataset.cf] = t.dataset.cf === 'amount' ? (t.value === '' ? '' : +t.value) : t.value; draftPreviewRefresh(); } return; }
    if (t.dataset.search === 'pub') { S.jq = t.value; const list = filteredJobs(); document.getElementById('pub-list').innerHTML = list.length ? list.map(j => jobListItem(j, j.id === S.jobId)).join('') : '<p class="text-muted text-[14px] p-4">No sample jobs match. Clear the search or pick another country.</p>'; return; }
    if (t.dataset.search === 'worker') { S.jq = t.value; const list = filteredJobs(); document.getElementById('worker-list').innerHTML = list.length ? list.map(j => jobListItem(j, false, 'openJob')).join('') : '<p class="text-muted text-[13px] py-6 text-center">No jobs match. Try another country.</p>'; return; }
    if (t.dataset.tfq !== undefined) { S.tf.q = t.value; document.getElementById('talent-results').innerHTML = talentResults(); return; }
    if (t.dataset.tf === 'minExp') { S.tf.minExp = +t.value; document.getElementById('minexp-val').textContent = t.value; document.getElementById('talent-results').innerHTML = talentResults(); return; }
    if (t.dataset.reg) { S.reg[t.dataset.reg] = t.value; }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.nav !== undefined) { go(t.value); return; }
    if (t.dataset.draft && t.tagName === 'SELECT') { if (t.dataset.draft === 'country') { S.draft.cur = COUNTRY[t.value].cur; } render(); return; }
    if (t.dataset.cost !== undefined && t.tagName === 'SELECT') { draftPreviewRefresh(); return; }
    if (t.dataset.consent) { S.consent[t.dataset.consent] = t.checked; render(); return; }
    if (t.dataset.tf && t.type === 'checkbox') { S.tf[t.dataset.tf] = t.checked; render(); return; }
    if (t.dataset.pipe) { t.checked ? S.pipeSel.add(t.dataset.pipe) : S.pipeSel.delete(t.dataset.pipe); render(); return; }
    if (t.dataset.ssvis !== undefined) { S.ss.vis = t.value; return; }
    if (t.dataset.cfg !== undefined) { S.cfg = t.value; render(); return; }
    if (t.dataset.regfile !== undefined) { S.reg.file = t.files[0]?.name || ''; render(); return; }
    if (t.dataset.casefile !== undefined) { if (t.files[0]) toast(`Uploaded ${t.files[0].name}. Your agency case officer can see it.`); return; }
    if (t.id === 'ss-file' && t.files[0]) {
      const f = t.files[0];
      if (!/^video\//.test(f.type)) { S.ss.err = 'That file is not a video. Choose an MP4, MOV or WebM file.'; render(); return; }
      const url = URL.createObjectURL(f); const v = document.createElement('video'); v.preload = 'metadata';
      v.onloadedmetadata = () => {
        if (v.duration > 30.5) { URL.revokeObjectURL(url); S.ss.err = `This video is ${Math.round(v.duration)} seconds. A SkillShow must be 30 seconds or less. Trim it or record again.`; S.ss.url = null; }
        else { if (S.ss.url) URL.revokeObjectURL(S.ss.url); S.ss.url = url; S.ss.dur = v.duration; S.ss.status = 'ready'; S.ss.err = ''; }
        render();
      };
      v.onerror = () => { S.ss.err = 'This video format cannot be previewed here. In production the server converts it.'; render(); };
      v.src = url;
    }
  });
  document.addEventListener('submit', e => {
    e.preventDefault();
    const f = e.target.dataset.form;
    if (f === 'msg') { const i = document.getElementById('msg-input'); const t = i.value.trim(); if (!t) return; S.msgs.push({ me: true, t, at: '18 Oct, ' + new Date().toTimeString().slice(0, 5) }); render(); setTimeout(() => document.getElementById('msg-input')?.focus(), 20); }
    if (f === 'reg') { S.reg.submitted = true; S.org.status = 'review'; S.queue.unshift({ id: 'V-' + (2302 + S.queue.length), type: 'employer', what: S.reg.name, sub: `Trade licence · ${COUNTRY[S.reg.country].short}`, at: '18 Oct', status: 'Pending', evidence: [S.reg.file || 'Licence file (not attached in prototype)', `Business email ${S.reg.email}`] }); render(); toast('Submitted for verification'); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.modal) { S.modal = null; render(); } });

  /* ---------- QR (decorative sample) ---------- */
  function drawQR() {
    const c = document.getElementById('qr'); if (!c) return;
    const ctx = c.getContext('2d'); const cs = getComputedStyle(document.documentElement);
    const col = v => `rgb(${cs.getPropertyValue(v).trim().split(/\s+/).join(',')})`;
    const n = 25, s = c.width / n; let seed = 42; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    ctx.fillStyle = col('--surface'); ctx.fillRect(0, 0, c.width, c.height); ctx.fillStyle = col('--ink');
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (rnd() > .52) ctx.fillRect(x * s, y * s, s, s);
    [[0, 0], [n - 7, 0], [0, n - 7]].forEach(([x, y]) => { ctx.fillStyle = col('--ink'); ctx.fillRect(x * s, y * s, 7 * s, 7 * s); ctx.fillStyle = col('--surface'); ctx.fillRect((x + 1) * s, (y + 1) * s, 5 * s, 5 * s); ctx.fillStyle = col('--brand'); ctx.fillRect((x + 2) * s, (y + 2) * s, 3 * s, 3 * s); });
  }

  /* ---------- render ---------- */
  let last = null;
  function render() {
    const id = current();
    const sy = window.scrollY;
    document.getElementById('app').innerHTML = shell(id);
    document.title = 'BLUESKILLS Prototype';
    if (id !== last) { window.scrollTo(0, 0); document.querySelector('.phone-body')?.scrollTo(0, 0); last = id; } else window.scrollTo(0, sy);
    if (id === 'i-cohort') drawQR();
  }
  window.addEventListener('hashchange', () => { S.modal = null; render(); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (current() === 'i-cohort') drawQR(); });
  render();
})();
</script>
